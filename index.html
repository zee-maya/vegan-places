<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La mia mappa dei ristoranti</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#1f2430; --panel:#272e3d; --panel2:#2f3850;
    --line:#3a4256; --text:#e8ecf4; --muted:#9aa6bf; --accent:#ff7a59; --accent2:#4ea1ff;
    --green:#49c17d; --amber:#f4b740; --red:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg)}
  #app{display:flex;height:100vh;overflow:hidden}
  /* Sidebar */
  #side{width:360px;min-width:360px;background:var(--panel);display:flex;flex-direction:column;border-right:1px solid var(--line);z-index:1000}
  #side header{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
  #side h1{font-size:17px;margin:0 0 2px;letter-spacing:.2px}
  #side .sub{font-size:12px;color:var(--muted)}
  .searchbar{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:8px}
  .searchbar input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:9px;font-size:13px;outline:none}
  .searchbar input:focus{border-color:var(--accent2)}
  .btn{border:none;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;background:var(--accent);color:#1b1b1b}
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn.sm{padding:6px 9px;font-size:12px;border-radius:8px}
  .filters{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{font-size:11.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;user-select:none}
  .chip.active{background:var(--accent2);border-color:var(--accent2);color:#06121f;font-weight:600}
  .filters input.find{flex:1;min-width:110px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:7px 9px;border-radius:8px;font-size:12px;outline:none}
  #list{flex:1;overflow-y:auto;padding:6px 10px 20px}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 20px;line-height:1.6}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin:8px 4px;cursor:pointer;transition:border-color .15s}
  .card:hover{border-color:var(--accent2)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .card .name{font-weight:600;font-size:14px;line-height:1.25}
  .card .stars{color:var(--amber);font-size:12px;letter-spacing:1px;white-space:nowrap}
  .card .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .tag{font-size:10.5px;padding:2px 8px;border-radius:999px;background:#38425c;color:#c9d4ee}
  .tag.status-todo{background:#4a3324;color:#ffb48a}
  .tag.status-done{background:#1f3b2c;color:#7ee0a6}
  .card .note{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .addr{font-size:11px;color:#71809d;margin-top:6px}
  footer.tools{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
  .count{font-size:11px;color:var(--muted);margin-left:auto;align-self:center}
  /* Map */
  #map{flex:1;height:100%}
  .leaflet-container{background:#121722}
  /* Add/edit form modal */
  .modal-bg{position:fixed;inset:0;background:rgba(10,14,22,.55);display:none;align-items:center;justify-content:center;z-index:3000}
  .modal-bg.show{display:flex}
  .modal{width:420px;max-width:92vw;max-height:90vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
  .modal h2{margin:0 0 14px;font-size:16px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:9px;font-size:13px;outline:none;font-family:inherit}
  .field input:focus,.field textarea:focus{border-color:var(--accent2)}
  .field textarea{resize:vertical;min-height:62px}
  .starpick{display:flex;gap:4px;font-size:24px;cursor:pointer}
  .starpick span{color:#4a556e;transition:color .1s}
  .starpick span.on{color:var(--amber)}
  .seg{display:flex;gap:8px}
  .seg label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:12.5px;color:var(--muted)}
  .seg input{display:none}
  .seg input:checked + span{color:var(--text);font-weight:600}
  .seg label:has(input:checked){border-color:var(--accent2);background:var(--panel2)}
  .modal .actions{display:flex;gap:9px;margin-top:8px}
  .modal .actions .btn{flex:1}
  .btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
  .hint{font-size:11px;color:#6d7a96;margin-top:-6px;margin-bottom:12px}
  .sresults{position:absolute;top:56px;left:16px;right:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;max-height:240px;overflow-y:auto;display:none;z-index:1200}
  .sresults div{padding:9px 11px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line)}
  .sresults div:hover{background:var(--panel)}
  .sresults div:last-child{border-bottom:none}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0e1420;border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:10px;font-size:13px;z-index:4000;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .mobile-toggle{display:none}
  @media (max-width:760px){
    #side{position:absolute;inset:0 auto 0 0;width:86vw;min-width:0;transform:translateX(-100%);transition:transform .25s}
    #side.open{transform:translateX(0)}
    .mobile-toggle{display:block;position:absolute;top:12px;left:12px;z-index:1500}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>🍝 La mia mappa dei ristoranti</h1>
      <div class="sub">Cerca un locale o clicca sulla mappa per salvarlo</div>
    </header>
    <div class="searchbar" style="position:relative">
      <input id="geoSearch" placeholder="Cerca ristorante o indirizzo…" autocomplete="off">
      <button class="btn" id="geoBtn">Cerca</button>
      <div class="sresults" id="sresults"></div>
    </div>
    <div class="filters">
      <button class="chip active" data-f="all">Tutti</button>
      <button class="chip" data-f="todo">Da provare</button>
      <button class="chip" data-f="done">Già stato</button>
      <input class="find" id="findSaved" placeholder="Filtra salvati…">
    </div>
    <div id="list"></div>
    <footer class="tools">
      <button class="btn ghost sm" id="exportBtn">⬇︎ Esporta backup</button>
      <button class="btn ghost sm" id="importBtn">⬆︎ Importa</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <span class="count" id="count">0 posti</span>
    </footer>
  </aside>
  <div id="map"></div>
  <button class="btn mobile-toggle" id="mToggle">☰ Lista</button>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h2 id="modalTitle">Nuovo posto</h2>
    <div class="field">
      <label>Nome del locale</label>
      <input id="fName" placeholder="Es. Trattoria da Mario">
    </div>
    <div class="field">
      <label>Indirizzo / zona</label>
      <input id="fAddr" placeholder="Indirizzo (facoltativo)">
    </div>
    <div class="field">
      <label>Voto</label>
      <div class="starpick" id="starpick">
        <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
      </div>
    </div>
    <div class="field">
      <label>Prezzo</label>
      <div class="seg" id="priceSeg">
        <label><input type="radio" name="price" value=""><span>—</span></label>
        <label><input type="radio" name="price" value="€"><span>€</span></label>
        <label><input type="radio" name="price" value="€€"><span>€€</span></label>
        <label><input type="radio" name="price" value="€€€"><span>€€€</span></label>
      </div>
    </div>
    <div class="field">
      <label>Categorie / tag <span style="color:#6d7a96">(separa con virgola)</span></label>
      <input id="fTags" placeholder="pizza, giapponese, romantico…">
    </div>
    <div class="field">
      <label>Link <span style="color:#6d7a96">(sito o Google Maps)</span></label>
      <input id="fLink" placeholder="https://…">
    </div>
    <div class="field">
      <label>Stato</label>
      <div class="seg">
        <label><input type="radio" name="status" value="todo" checked><span>🔖 Da provare</span></label>
        <label><input type="radio" name="status" value="done"><span>✅ Già stato</span></label>
      </div>
    </div>
    <div class="field">
      <label>Note</label>
      <textarea id="fNotes" placeholder="Cosa ordinare, impressioni, con chi andare…"></textarea>
    </div>
    <div class="actions">
      <button class="btn danger" id="delBtn" style="flex:0 0 auto;display:none">Elimina</button>
      <button class="btn ghost" id="cancelBtn">Annulla</button>
      <button class="btn" id="saveBtn">Salva</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

%20Vegan%20Home%20Asciano%20Toscana","lat":43.23482,"lng":11.56655}];</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";
  var KEY = "myRestaurantMap.v1";

  // ---- storage (per-browser, wrapped) ----
  function load(){
    try{ var raw = localStorage.getItem(KEY); if(raw){ return JSON.parse(raw); } }catch(e){}
    // first run in this browser: seed from the embedded dataset
    try{
      if(window.SEED && window.SEED.length){
        try{ localStorage.setItem(KEY, JSON.stringify(window.SEED)); }catch(e){}
        return window.SEED.slice();
      }
    }catch(e){}
    return [];
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(places)); }
    catch(e){ toast("Impossibile salvare nel browser — usa Esporta per non perdere i dati"); }
  }
  var places = load();

  // ---- map ----
  var MILAN=[45.4642,9.19];
  var map = L.map('map',{zoomControl:true}).setView(MILAN, 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(map);

  var markers = {}; // id -> marker
  function pinIcon(status, rating){
    var color = status==='done' ? '#49c17d' : '#ff7a59';
    return L.divIcon({
      className:'',
      html:'<div style="width:26px;height:26px;transform:translate(-13px,-26px)">'
        +'<svg viewBox="0 0 24 24" width="26" height="26"><path fill="'+color+'" stroke="#1b1b1b" stroke-width="1" d="M12 2C7.6 2 4 5.6 4 10c0 5.2 7 11.5 7.3 11.8.4.3 1 .3 1.4 0C13 21.5 20 15.2 20 10c0-4.4-3.6-8-8-8z"/><circle cx="12" cy="10" r="3.2" fill="#1b1b1b"/></svg>'
        +'</div>',
      iconSize:[26,26], iconAnchor:[0,0]
    });
  }

  function renderMarkers(){
    for(var k in markers){ map.removeLayer(markers[k]); }
    markers = {};
    places.forEach(function(p){
      var m = L.marker([p.lat,p.lng],{icon:pinIcon(p.status,p.rating)}).addTo(map);
      m.bindPopup(popupHtml(p));
      m.on('click', function(){ /* popup opens automatically */ });
      m.on('popupopen', function(){
        var el = document.querySelector('.edit-pop[data-id="'+p.id+'"]');
        if(el){ el.onclick=function(){ openModal(p); }; }
      });
      markers[p.id]=m;
    });
  }
  function popupHtml(p){
    var stars = p.rating ? '<span style="color:#f4b740">'+'★'.repeat(p.rating)+'<span style="color:#ccc">'+'★'.repeat(5-p.rating)+'</span></span>' : '';
    var tags = (p.tags||[]).map(function(t){return '<span style="background:#eee;border-radius:10px;padding:1px 7px;font-size:11px;margin-right:3px">'+esc(t)+'</span>';}).join('');
    var st = p.status==='done' ? '✅ Già stato' : '🔖 Da provare';
    var price = p.price ? ' · <span style="color:#2a7d4f;font-weight:600">'+p.price+'</span>' : '';
    var link = p.link ? '<div style="margin-bottom:6px"><a href="'+esc(p.link)+'" target="_blank" rel="noopener" style="font-size:12px;color:#4ea1ff">Apri link ↗</a></div>' : '';
    return '<div style="min-width:170px;font-family:sans-serif">'
      +'<div style="font-weight:700;font-size:14px;margin-bottom:3px">'+esc(p.name||'Senza nome')+'</div>'
      +(stars?'<div style="margin-bottom:4px">'+stars+'</div>':'')
      +'<div style="font-size:12px;color:#555;margin-bottom:5px">'+st+price+'</div>'
      +(tags?'<div style="margin-bottom:5px">'+tags+'</div>':'')
      +(p.notes?'<div style="font-size:12px;color:#444;margin-bottom:6px">'+esc(p.notes)+'</div>':'')
      +link
      +'<button class="edit-pop" data-id="'+p.id+'" style="border:none;background:#4ea1ff;color:#fff;padding:5px 10px;border-radius:7px;font-size:12px;cursor:pointer">Modifica</button>'
      +'</div>';
  }

  // ---- list rendering ----
  var curFilter='all', findText='';
  function matches(p){
    if(curFilter!=='all' && p.status!==curFilter) return false;
    if(findText){
      var hay=((p.name||'')+' '+(p.notes||'')+' '+(p.tags||[]).join(' ')+' '+(p.addr||'')).toLowerCase();
      if(hay.indexOf(findText)<0) return false;
    }
    return true;
  }
  function renderList(){
    var list=document.getElementById('list');
    var shown = places.filter(matches).sort(function(a,b){return (b.rating||0)-(a.rating||0);});
    document.getElementById('count').textContent = places.length+' post'+(places.length===1?'o':'i');
    if(!places.length){
      list.innerHTML='<div class="empty">Nessun posto ancora.<br>Cerca un ristorante qui sopra, oppure clicca un punto sulla mappa per salvarlo.</div>';
      return;
    }
    if(!shown.length){ list.innerHTML='<div class="empty">Nessun risultato con questi filtri.</div>'; return; }
    list.innerHTML = shown.map(function(p){
      var stars = p.rating ? '<span class="stars">'+'★'.repeat(p.rating)+'</span>' : '';
      var st = '<span class="tag status-'+(p.status==='done'?'done':'todo')+'">'+(p.status==='done'?'Già stato':'Da provare')+'</span>';
      var price = p.price ? '<span class="tag" style="background:#1f3b2c;color:#7ee0a6">'+p.price+'</span>' : '';
      var tags = (p.tags||[]).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('');
      return '<div class="card" data-id="'+p.id+'">'
        +'<div class="top"><div class="name">'+esc(p.name||'Senza nome')+'</div>'+stars+'</div>'
        +'<div class="meta">'+st+price+tags+'</div>'
        +(p.notes?'<div class="note">'+esc(p.notes)+'</div>':'')
        +(p.addr?'<div class="addr">'+esc(p.addr)+'</div>':'')
        +'</div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.card'),function(c){
      c.onclick=function(){
        var p=byId(c.getAttribute('data-id'));
        if(p){ map.flyTo([p.lat,p.lng],15); var mk=markers[p.id]; if(mk) mk.openPopup(); closeMobile(); }
      };
    });
  }

  // ---- modal ----
  var editing=null, pendingLatLng=null, curRating=0;
  function openModal(p, latlng){
    editing = p || null;
    pendingLatLng = latlng || null;
    document.getElementById('modalTitle').textContent = p ? 'Modifica posto' : 'Nuovo posto';
    document.getElementById('fName').value = p?p.name||'':'';
    document.getElementById('fAddr').value = p?p.addr||'': (latlng && latlng._addr || '');
    document.getElementById('fTags').value = p?(p.tags||[]).join(', '):'';
    document.getElementById('fLink').value = p?p.link||'':'';
    document.getElementById('fNotes').value = p?p.notes||'':'';
    document.querySelector('input[name="price"][value="'+(p?p.price||'':'')+'"]').checked=true;
    setRating(p?p.rating||0:0);
    var st = p?p.status:'todo';
    document.querySelector('input[name="status"][value="'+st+'"]').checked=true;
    document.getElementById('delBtn').style.display = p?'block':'none';
    document.getElementById('modalBg').classList.add('show');
    setTimeout(function(){document.getElementById('fName').focus();},50);
  }
  function closeModal(){ document.getElementById('modalBg').classList.remove('show'); editing=null; pendingLatLng=null; }
  function setRating(v){ curRating=v; Array.prototype.forEach.call(document.querySelectorAll('#starpick span'),function(s){ s.classList.toggle('on', parseInt(s.getAttribute('data-v'))<=v); }); }
  document.getElementById('starpick').addEventListener('click',function(e){ if(e.target.dataset.v){ var v=parseInt(e.target.dataset.v); setRating(v===curRating?0:v); } });

  document.getElementById('saveBtn').onclick=function(){
    var name=document.getElementById('fName').value.trim();
    var addr=document.getElementById('fAddr').value.trim();
    var tags=document.getElementById('fTags').value.split(',').map(function(t){return t.trim();}).filter(Boolean);
    var notes=document.getElementById('fNotes').value.trim();
    var link=document.getElementById('fLink').value.trim();
    var price=(document.querySelector('input[name="price"]:checked')||{}).value||'';
    var status=document.querySelector('input[name="status"]:checked').value;
    if(editing){
      editing.name=name; editing.addr=addr; editing.tags=tags; editing.notes=notes; editing.status=status; editing.rating=curRating; editing.price=price; editing.link=link;
    }else{
      if(!pendingLatLng){ toast('Posizione mancante'); return; }
      places.push({id:uid(),name:name,addr:addr,tags:tags,notes:notes,status:status,rating:curRating,price:price,link:link,lat:pendingLatLng.lat,lng:pendingLatLng.lng});
    }
    save(); renderMarkers(); renderList(); closeModal(); toast('Salvato');
  };
  document.getElementById('delBtn').onclick=function(){
    if(editing && confirm('Eliminare "'+(editing.name||'questo posto')+'"?')){
      places=places.filter(function(p){return p.id!==editing.id;});
      save(); renderMarkers(); renderList(); closeModal(); toast('Eliminato');
    }
  };
  document.getElementById('cancelBtn').onclick=closeModal;
  document.getElementById('modalBg').addEventListener('click',function(e){ if(e.target.id==='modalBg') closeModal(); });

  // ---- click map to add ----
  map.on('click', function(e){
    openModal(null, e.latlng);
    // try reverse geocode to prefill address
    reverseGeocode(e.latlng.lat, e.latlng.lng).then(function(label){
      if(label && document.getElementById('modalBg').classList.contains('show') && !document.getElementById('fAddr').value){
        document.getElementById('fAddr').value=label;
      }
    });
  });

  // ---- geocoding (Nominatim) ----
  function geocode(q){
    return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}})
      .then(function(r){return r.json();}).catch(function(){return [];});
  }
  function reverseGeocode(lat,lng){
    return fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng,{headers:{'Accept':'application/json'}})
      .then(function(r){return r.json();}).then(function(d){return d.display_name||'';}).catch(function(){return '';});
  }
  var sres=document.getElementById('sresults');
  function doSearch(){
    var q=document.getElementById('geoSearch').value.trim();
    if(!q){ sres.style.display='none'; return; }
    sres.innerHTML='<div>Cerco…</div>'; sres.style.display='block';
    geocode(q).then(function(res){
      if(!res.length){ sres.innerHTML='<div>Nessun risultato</div>'; return; }
      sres.innerHTML='';
      res.forEach(function(r){
        var d=document.createElement('div');
        d.textContent=r.display_name;
        d.onclick=function(){
          sres.style.display='none';
          document.getElementById('geoSearch').value='';
          var lat=parseFloat(r.lat), lng=parseFloat(r.lon);
          map.flyTo([lat,lng],16);
          var nameGuess=r.display_name.split(',')[0];
          var ll={lat:lat,lng:lng};
          openModal(null, ll);
          document.getElementById('fName').value=nameGuess;
          document.getElementById('fAddr').value=r.display_name;
        };
        sres.appendChild(d);
      });
    });
  }
  document.getElementById('geoBtn').onclick=doSearch;
  document.getElementById('geoSearch').addEventListener('keydown',function(e){ if(e.key==='Enter') doSearch(); });
  document.addEventListener('click',function(e){ if(!e.target.closest('.searchbar')) sres.style.display='none'; });

  // ---- filters ----
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){
    c.onclick=function(){
      document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active');});
      c.classList.add('active'); curFilter=c.getAttribute('data-f'); renderList();
    };
  });
  document.getElementById('findSaved').addEventListener('input',function(e){ findText=e.target.value.toLowerCase().trim(); renderList(); });

  // ---- export / import ----
  document.getElementById('exportBtn').onclick=function(){
    var blob=new Blob([JSON.stringify(places,null,2)],{type:'application/json'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='mappa-ristoranti-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
    toast('Backup esportato');
  };
  document.getElementById('importBtn').onclick=function(){ document.getElementById('importFile').click(); };
  document.getElementById('importFile').addEventListener('change',function(e){
    var f=e.target.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var data=JSON.parse(rd.result);
        if(!Array.isArray(data)) throw 0;
        var existing={}; places.forEach(function(p){existing[p.id]=true;});
        var added=0;
        data.forEach(function(p){ if(p && p.lat && p.lng){ if(!p.id||existing[p.id]) p.id=uid(); places.push(p); added++; } });
        save(); renderMarkers(); renderList(); toast(added+' posti importati');
      }catch(err){ toast('File non valido'); }
    };
    rd.readAsText(f); e.target.value='';
  });

  // ---- mobile ----
  document.getElementById('mToggle').onclick=function(){ document.getElementById('side').classList.toggle('open'); };
  function closeMobile(){ if(window.innerWidth<=760) document.getElementById('side').classList.remove('open'); }

  // ---- helpers ----
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function byId(id){ for(var i=0;i<places.length;i++) if(places[i].id===id) return places[i]; return null; }
  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  var toastT;
  function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},2200); }

  // ---- init ----
  renderMarkers(); renderList();
  map.setView(MILAN,12);
})();
</script>
</body>
</html>
